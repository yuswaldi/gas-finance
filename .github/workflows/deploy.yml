name: Deploy FinKeluarga to Google Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Clasp & Dependencies
        run: |
          npm install

      - name: Authenticate Clasp
        run: |
          mkdir -p ~/.clasp
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: Inject Script ID
        run: |
          node -e "
            const fs = require('fs');
            const claspConfig = {
              scriptId: '${{ secrets.SCRIPT_ID }}',
              rootDir: 'src'
            };
            fs.writeFileSync('./.clasp.json', JSON.stringify(claspConfig, null, 2));
          "
      - name: Verify Directory & Files
        run: |
          echo "=== Root Directory Content ==="
          ls -la
          echo "=== Content of ./src Directory ==="
          if [ -d "./src" ]; then
            ls -la ./src
          else
            echo "ERROR: Folder ./src tidak ditemukan di repository!"
            exit 1
          fi

      - name: Deploy Code to Google Apps Script
        run: |
          npx clasp push --force

      - name: Audit Deployment Status
        run: |
          npx clasp status
          echo "Deployment FinKeluarga berhasil didorong ke Google Apps Script."
